<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      overflow: hidden;
      background: #000;
      margin: 0;
    }

    #startButton {
      display: block;
      width: 160px;
      height: 40px;
      background-color: #4caf50;
      color: white;
      text-align: center;
      font-size: 16px;
      margin: 20px auto;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: "Press Start 2P", cursive;
    }
  </style>

  <link
    href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
    rel="stylesheet"
  />
</head>

<body>

  <button id="startButton">PLAY</button>

  <script>
    document.getElementById("startButton").onclick = function () {
      window.location.href = "https://pokerogue.net/";
    };
  </script>

</body>
</html>
