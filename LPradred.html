<div id="container">
  <div id="game" style="display: none;"></div>
  <button id="startButton">PLAY</button>
</div>

<script>
  function startGame() {

    document.getElementById("game").style.display = "block";
    document.getElementById("startButton").style.display = "none";

    /*
     * EmulatorJS configuration
     */

    EJS_player = "#game";

    // GBA emulator core
    EJS_core = "mgba";

    // Game ROM
    EJS_gameUrl =
  "https://pub-c0f75560b45a4f46a002af7e90e29a9a.r2.dev/radicalred41.gba";

    // EmulatorJS data files
    EJS_pathtodata =
      "https://cdn.emulatorjs.org/stable/data/";

    // Start after EmulatorJS loads
    EJS_startOnLoaded = true;

    // Black emulator theme
    EJS_color = "#000000";

    // Game title
    EJS_gameName = "Radical Red";

    // Use desktop-style controls/interface on Chromebook
    EJS_browserMode = "desktop";

    /*
     * Load EmulatorJS
     */
    var script = document.createElement("script");

    script.src =
      "https://cdn.emulatorjs.org/stable/data/loader.js";

    script.onload = function () {
      console.log("EmulatorJS loaded.");
    };

    script.onerror = function () {
      alert(
        "EmulatorJS could not be loaded. Check your internet connection."
      );
    };

    document.body.appendChild(script);
  }

  document
    .getElementById("startButton")
    .addEventListener("click", startGame);
</script>
