<!DOCTYPE html>

<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PokéRogue</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #game {
      width: 100%;
      height: 100%;
      border: none;
    }

    #start {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);

      padding: 18px 35px;
      font-size: 20px;
      font-family: Arial, sans-serif;
      font-weight: bold;

      color: white;
      background: #4caf50;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    #start:hover {
      background: #43a047;
    }
  </style>

</head>

<body>

<button id="start">PLAY POKÉROGUE</button>

  <iframe
    id="game"
    style="display:none;"
    allow="fullscreen"
    src="about:blank">
  </iframe>

  <script>
    document.getElementById("start").onclick = function () {
      document.getElementById("start").style.display = "none";

      const game = document.getElementById("game");
      game.style.display = "block";

      game.src = "https://pokerogue.net/";
    };
  </script>

</body>
</html>
