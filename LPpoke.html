<script>
  function startGame() {

    document.getElementById("game").style.display = "block";
    document.getElementById("startButton").style.display = "none";

    // EmulatorJS configuration
    EJS_player = "#game";

    // Nintendo DS emulator core
    EJS_core = "melonds";

    // Your own legally obtained HeartGold/SoulSilver game file
    EJS_gameUrl =
      "https://YOUR-DOMAIN.example/your-game-file.nds";

    // EmulatorJS data
    EJS_pathtodata =
      "https://cdn.emulatorjs.org/stable/data/";

    EJS_startOnLoaded = true;

    EJS_color = "#000000";

    EJS_gameName = "Pokémon HeartGold";

    EJS_browserMode = "desktop";

    // Load EmulatorJS
    var script = document.createElement("script");

    script.src =
      "https://cdn.emulatorjs.org/stable/data/loader.js";

    script.onload = function () {
      console.log("EmulatorJS loaded.");
    };

    script.onerror = function () {
      alert(
        "EmulatorJS could not be loaded. Check your internet connection."
      );
    };

    document.body.appendChild(script);
  }

  document
    .getElementById("startButton")
    .addEventListener("click", startGame);
</script>
